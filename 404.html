<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>404 · 页面未找到 · FOSS-Nav</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b82f6'/%3E%3Ctext x='50%25' y='52%25' font-size='38' text-anchor='middle' dominant-baseline='middle' fill='white'%3E🧭%3C/text%3E%3C/svg%3E" />
  <style>
    /* 404 页面专用样式（内联，避免引入 styles.css 也要先加载才能看） */
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #f6f8fb;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b1220; color: #e6edf7; }
    }
    .nf {
      max-width: 520px;
      text-align: center;
    }
    .nf-code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      margin: 0 0 16px;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      letter-spacing: -0.04em;
    }
    .nf-title {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    .nf-desc {
      font-size: 14.5px;
      color: #475569;
      margin: 0 0 28px;
      line-height: 1.7;
    }
    @media (prefers-color-scheme: dark) {
      .nf-desc { color: #9aa9c0; }
    }
    .nf-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .nf-btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .nf-btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -4px rgba(59, 130, 246, 0.4);
    }
    .nf-btn-secondary {
      background: transparent;
      color: inherit;
      border: 1px solid #cbd5e1;
    }
    .nf-btn-secondary:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }
    @media (prefers-color-scheme: dark) {
      .nf-btn-secondary { border-color: #2a3a5c; }
    }
  </style>
</head>
<body>
  <main class="nf" role="main">
    <div class="nf-code">404</div>
    <h1 class="nf-title">页面未找到</h1>
    <p class="nf-desc">
      你访问的链接可能已失效、被移动，或从未存在过。
      <br />回到首页继续浏览 FOSS-Nav 收录的开源导航工具。
    </p>
    <div class="nf-actions">
      <a class="nf-btn nf-btn-primary" href="./">🧭 回到首页</a>
      <a class="nf-btn nf-btn-secondary" href="./#/">📑 工具列表</a>
    </div>
  </main>
</body>
</html>
